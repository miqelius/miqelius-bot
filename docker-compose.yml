version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pdf_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_bot_network

  bot:
    build: .
    container_name: pdf_rag_bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - pdf_bot_network
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres

volumes:
  postgres_data:

networks:
  pdf_bot_network:
    driver: bridge
